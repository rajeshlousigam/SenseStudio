[workspace]
resolver = "2"
members = ["crates/sense-core", "crates/sense-cli"]

[workspace.package]
version = "1.0.0-beta.2"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
