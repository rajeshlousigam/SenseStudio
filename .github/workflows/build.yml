name: Build

# Tag pushes (v*) build every platform and publish a draft pre-release.
# Manual runs build and upload the artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    # Both slices build on an Apple Silicon runner; x86_64 is cross-compiled
    # (official Qt for macOS is universal, Rust and clang cross-build natively).
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Ninja
        run: brew install ninja

      - name: Package
        run: ./packaging/package-macos.sh "${{ matrix.arch }}" "$QT_ROOT_DIR"

      # Engine tests run against the exact FFmpeg that ships in the app.
      - name: Test engine
        if: matrix.arch == 'arm64'
        run: PATH="$PWD/.cache/tools/macos-arm64:$PATH" cargo test --workspace

      - uses: actions/upload-artifact@v4
        with:
          name: SenseStudio-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Package
        shell: pwsh
        run: ./packaging/package-windows.ps1 -QtDir $env:QT_ROOT_DIR

      - uses: actions/upload-artifact@v4
        with:
          name: SenseStudio-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          name: SenseStudio ${{ github.ref_name }}
          files: dist/*
          body: |
            Internal beta. Builds are unsigned, so the OS asks once before the first launch.

            **macOS** (12 Monterey or newer): download the `arm64` DMG for Apple Silicon (M1–M4) or `x86_64` for Intel Macs.
            Drag SenseStudio to Applications, then run once in Terminal:
            `xattr -dr com.apple.quarantine /Applications/SenseStudio.app`

            **Windows** (10/11, 64-bit): unzip anywhere and run `SenseStudio.exe`.
            If SmartScreen appears, choose **More info → Run anyway**.

            FFmpeg, ffprobe and yt-dlp are bundled; nothing else needs installing.
